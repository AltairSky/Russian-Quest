## Roots before words

One root carries twenty verbs. We learn it once, then harvest the family: \`-держ-\` gives содержа́ть *contain*, поддержа́ть *support*, воздержа́ться *abstain*.

## Prefixes as grammar, not decoration

Each prefix has a spatial core and predictable extensions. \`вы-\` *out, to completion* · \`за-\` *beyond, to begin* · \`пере-\` *across, again*. Unknown verbs stop being unknown.

## Aspect as a way of seeing

Perfective and imperfective aren't tenses to memorize — they're two camera angles on one event. \`писа́л письмо\` *was writing* · \`написа́л письмо\` *got it written*.

## 2026-07-26 — Why по- and у- are not the same "perfective"

Textbooks say both prefixes "make a verb perfective," as if they were interchangeable stamps. But \`пообе́дать\` and \`уе́хать\` perfectivize for different reasons — one bounds an activity in time, the other completes a trajectory. Feel that difference once and half the prefix system opens up.

![YouTube links become an embedded player — demo: the first video ever uploaded](https://youtu.be/jNQXAC9IVRw)

## 2026-07-19 — Stress is grammar: за́мок vs замо́к

A castle and a lock, spelled identically. Russian stress isn't a pronunciation detail — it distinguishes words, cases, and aspect pairs: \`за́мок\` (castle) · \`замо́к\` (lock). Stress likes to move in patterns, and the patterns can be learned.

![A photo, diagram, or video can go right here — see the comment at the top of the HTML](https://picsum.photos/seed/ru/720/400)

## 2026-07-11 — The root -держ-: hold, contain, restrain, state

From \`держа́ть\` "to hold" grows a whole political vocabulary: \`содержа́ние\` "content," \`держа́ва\` "great power," \`сде́ржанный\` "reserved." One root, one metaphor, twenty words for free.

   //~~~~~~ | ~~~~~~\\        ___
  //  вы-   |  у-    \\      (o o)
 //   на-   |  по-    \\      \_/   « пиши́ — прочита́ю »
((==========|==========))      |

};

/* ================= markdown rendering ================= */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, '<span class="ru">$1</span>')
    .replace(/\[(.+?)\]\((.+?)\)/g, (m, t, u) => {
      if (u.startsWith("#")) return `<a href="#" onclick="run('${u.slice(1)}');return false">${t}</a>`;
      const cls = t.startsWith("./") ? ' class="btn"' : "";
      return `<a href="${u}" target="_blank" rel="noopener"${cls}>${t}</a>`;
    })
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function media(alt, url) {
  const cap = alt ? `<div class="caption"># ${esc(alt)}</div>` : "";
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);
  if (yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy" title="${esc(alt)}"></iframe>${cap}`;
  if (/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(url)) return `<video controls preload="metadata" src="${esc(url)}"></video>${cap}`;
  return `<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy">${cap}`;
}
function renderBlocks(lines) {
  let html = "", para = [], list = [], table = [];
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const flushList = () => { if (list.length) { html += `<ul>${list.map(li => `<li>${inline(li)}</li>`).join("")}</ul>`; list = []; } };
  const isSep = s => /^\|?[\s:|-]+\|?$/.test(s) && s.includes("-");
  const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => inline(c.trim()));
  const flushTable = () => {
    if (!table.length) return;
    let header = null, body = [...table];
    if (table.length >= 2 && isSep(table[1])) { header = table[0]; body = table.slice(2); }
    body = body.filter(r => !isSep(r));
    let t = '<div class="tablewrap"><table>';
    if (header) t += "<thead><tr>" + cells(header).map(c => `<th>${c}</th>`).join("") + "</tr></thead>";
    t += "<tbody>" + body.map(r => "<tr>" + cells(r).map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>";
    html += t;
    table = [];
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  for (const raw of lines) {
    const line = raw.trimEnd();
    const m = line.match(/^!\[(.*?)\]\((.+?)\)\s*$/);
    if (line.trim().startsWith("|")) { flushPara(); flushList(); table.push(line.trim()); continue; }
    if (!line.trim()) { flushAll(); continue; }
    if (m) { flushAll(); html += media(m[1], m[2]); continue; }
    if (line.startsWith("## ")) { flushAll(); html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
    if (line.startsWith("# "))  { flushAll(); html += `<h2>${inline(line.slice(2))}</h2>`; continue; }
    if (/^---+$/.test(line.trim())) { flushAll(); html += "<hr>"; continue; }
    if (line.startsWith("- ")) { flushPara(); flushTable(); list.push(line.slice(2)); continue; }
    flushTable();
    para.push(line);
  }
  flushAll();
  return html;
}
function renderPostList(posts) {
  return posts.map(p => `
    <article class="post">
      ${p.date ? `<div class="meta">${p.date}</div>` : ""}
      <h2>${inline(p.title)}</h2>
      ${renderBlocks(p.lines)}
    </article>`).join("");
}
function renderBlogSection(lines) {
  const posts = [];
  let cur = null;
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.startsWith("## ")) {
      if (cur) posts.push(cur);
      const head = line.slice(3);
      const dm = head.match(/^(\d{4}-\d{2}-\d{2})\s*[—–-]\s*(.+)$/);
      cur = { date: dm ? dm[1] : "", title: dm ? dm[2] : head, lines: [] };
    } else if (cur) cur.lines.push(raw);
  }
  if (cur) posts.push(cur);
  if (!posts.length) return renderBlocks(lines);
  return renderPostList(posts);
}

/* ================= content loading ================= */
/* Set GITHUB_REPO to this site's repository name after deploy to enable
   automatic listing of the posts/ folder via the GitHub API. */
const GITHUB_USER = "AltairSky";
const GITHUB_REPO = "Russian-Quest";

let SECTIONS = { main: [], blog: [] };
let EXT_POSTS = null;                       /* posts loaded from posts/ files */
let mainSource = "built-in demo";
let blogSource = "built-in demo";
let postsSource = "";

function parseContent(text) {
  const out = {};
  let name = null, buf = [];
  for (const raw of text.split(/\r?\n/)) {
    const m = raw.match(/^# (.+)\s*$/);
    if (m) {
      if (name) out[name] = buf;
      name = m[1].trim().toLowerCase();
      buf = [];
    } else if (name) buf.push(raw);
  }
  if (name) out[name] = buf;
  const keys = Object.keys(out);
  return {
    main: out["main"] || (keys[0] ? out[keys[0]] : []),
    blog: out["blog"] || out["notebook"] || (keys[1] ? out[keys[1]] : [])
  };
}
async function fetchText(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    if (r.ok) { const t = await r.text(); if (t.trim()) return t; }
  } catch (e) { /* not there */ }
  return null;
}
async function loadContent() {
  const mainMd = await fetchText("main.md");
  const contentMd = await fetchText("content.md");
  const parsed = contentMd ? parseContent(contentMd) : null;
  const fb = parseContent(FALLBACK);

  if (mainMd) { SECTIONS.main = mainMd.split(/\r?\n/); mainSource = "main.md"; }
  else if (parsed && parsed.main.length) { SECTIONS.main = parsed.main; mainSource = "content.md"; }
  else { SECTIONS.main = fb.main; }

  if (parsed && parsed.blog.length) { SECTIONS.blog = parsed.blog; blogSource = "content.md"; }
  else { SECTIONS.blog = fb.blog; }
}
async function loadExternalPosts() {
  let files = null;
  let attempts = [];
  /* work out user/repo — explicit constants win, otherwise derive from the URL */
  let user = GITHUB_USER, repo = GITHUB_REPO;
  if (location.hostname.endsWith(".github.io")) user = location.hostname.split(".")[0] || user;
  if (!repo) {
    const seg = location.pathname.split("/").filter(Boolean);
    if (seg.length && !seg[0].includes(".")) repo = seg[0];            /* project page: /repo/... */
    else if (location.hostname.endsWith(".github.io")) repo = location.hostname; /* user site repo */
  }
  /* a) GitHub API listing of posts/ */
  if (user && repo) {
    try {
      const r = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/posts`);
      if (r.ok) {
        const j = await r.json();
        if (Array.isArray(j)) {
          files = j.map(f => f.name).filter(n => n.endsWith(".md"));
          postsSource = `posts/ via API (${user}/${repo})`;
        }
      } else attempts.push(`API ${user}/${repo}: ${r.status}`);
    } catch (e) { attempts.push(`API ${user}/${repo}: unreachable`); }
  } else attempts.push("API: repo unknown — set GITHUB_REPO");
  /* b) manifest file */
  if (!files) {
    try {
      const r = await fetch("posts/index.txt", { cache: "no-store" });
      if (r.ok) {
        files = (await r.text()).split(/\r?\n/).map(s => s.trim()).filter(s => s.endsWith(".md"));
        postsSource = "posts/index.txt";
      } else attempts.push(`index.txt: ${r.status}`);
    } catch (e) { attempts.push("index.txt: unreachable"); }
  }
  if (!files || !files.length) {
    postsSource = blogSource + " (" + (files ? "posts list empty" : attempts.join(" · ")) + ")";
    return null;
  }
  files.sort().reverse();                    /* date-prefixed names → newest first */
  const posts = await Promise.all(files.map(async name => {
    try {
      const r = await fetch("posts/" + name, { cache: "no-store" });
      if (!r.ok) return null;
      const lines = (await r.text()).split(/\r?\n/);
      let title = name.replace(/\.md$/, "").replace(/^\d{4}-\d{2}-\d{2}-?/, "").replace(/-/g, " ");
      const body = [];
      let gotTitle = false;
      for (const ln of lines) {
        const m = ln.match(/^#\s+(.+)$/);
        if (!gotTitle && m) { title = m[1].trim(); gotTitle = true; continue; }
        body.push(ln);
      }
      const dm = name.match(/^(\d{4}-\d{2}-\d{2})/);
      return { date: dm ? dm[1] : "", title, lines: body };
    } catch (e) { return null; }
  }));
  const ok = posts.filter(Boolean);
  if (!ok.length) postsSource = blogSource + " (post files listed but failed to load)";
  return ok.length ? ok : null;
}

/* ================= game: prefix lab ================= */
/* One verb of motion, ten spatial prefixes. options[0] is always correct
   (shuffled at render time). frames = ASCII animation for the round:
   я is the player, [  ] a house, O a person, * the goal, ║ a street. */
const GAME_ITEMS = [
  { pre: "в-",    meaning: "to go in, enter",              options: ["в-", "вы-", "у-", "при-"],    result: "войти́",    why: "в- = in",
    frames: ["я     [  ]\n──────────", "  я   [  ]\n──────────", "     я[  ]\n──────────", "      [я ]\n──────────"] },
  { pre: "вы-",   meaning: "to go out, exit",              options: ["вы-", "в-", "до-", "за-"],    result: "вы́йти",    why: "вы- = out",
    frames: ["      [я ]\n──────────", "     я[  ]\n──────────", "  я   [  ]\n──────────", "я     [  ]\n──────────"] },
  { pre: "при-",  meaning: "to come, arrive",              options: ["при-", "у-", "об-", "пере-"], result: "прийти́",   why: "при- = arrive, reach the place",
    frames: ["я       [  ]\n────────────", "   я    [  ]\n────────────", "      я [  ]\n────────────", "        я[  ]\n────────────"] },
  { pre: "у-",    meaning: "to go away, leave",            options: ["у-", "при-", "в-", "под-"],   result: "уйти́",     why: "у- = away",
    frames: ["[  ]я\n──────────", "[  ]  я\n──────────", "[  ]    я\n──────────", "[  ]      я\n──────────"] },
  { pre: "под-",  meaning: "to come up close (to someone)", options: ["под-", "от-", "вы-", "за-"], result: "подойти́",  why: "под- = up close",
    frames: ["я      O\n─────────", "  я    O\n─────────", "    я  O\n─────────", "      яO\n─────────"] },
  { pre: "от-",   meaning: "to step away a little",        options: ["от-", "под-", "до-", "в-"],   result: "отойти́",   why: "от- = a step away",
    frames: ["Oя\n─────────", "O я\n─────────", "O  я\n─────────", "O    я\n─────────"] },
  { pre: "пере-", meaning: "to cross (the street)",        options: ["пере-", "об-", "вы-", "у-"],  result: "перейти́",  why: "пере- = across",
    frames: ["я    ║\n──────────", "   я ║\n──────────", "     ║я\n──────────", "     ║   я\n──────────"] },
  { pre: "до-",   meaning: "to reach, get all the way to", options: ["до-", "за-", "от-", "при-"],  result: "дойти́",    why: "до- = up to the goal (*)",
    frames: ["я       *\n──────────", "  я     *\n──────────", "    я   *\n──────────", "       я*\n──────────"] },
  { pre: "за-",   meaning: "to drop in for a moment",      options: ["за-", "пере-", "в-", "до-"],  result: "зайти́",    why: "за- = a quick stop on the way",
    frames: ["я  [  ]\n──────────", " я [  ]\n──────────", "   [я ]\n──────────", "   [  ] я\n──────────"] },
  { pre: "об-",   meaning: "to go around",                 options: ["об-", "пере-", "под-", "от-"], result: "обойти́",  why: "об- = around",
    frames: ["\n я [  ]\n──────────", "  я\n   [  ]\n──────────", "      я\n   [  ]\n──────────", "\n   [  ] я\n──────────"] }
];
const ROUNDS = 7;
let g = null;
let animTimer = null;

function playAnim(frames) {
  clearInterval(animTimer);
  const el = document.getElementById("ganim");
  if (!el) return;
  if (reduced) { el.textContent = frames[frames.length - 1]; return; }
  let f = 0;
  el.textContent = frames[0];
  animTimer = setInterval(() => {
    const el2 = document.getElementById("ganim");
    if (!el2) { clearInterval(animTimer); return; }
    f = (f + 1) % (frames.length + 2);            /* +2 = a small hold on the last frame */
    el2.textContent = frames[Math.min(f, frames.length - 1)];
  }, 430);
}

function startGame() {
  const pool = [...GAME_ITEMS].sort(() => Math.random() - 0.5).slice(0, ROUNDS);
  g = { pool, i: 0, score: 0, streak: 0, answered: false };
  renderRound();
}
function renderRound() {
  const it = g.pool[g.i];
  const opts = it.options.map((o, k) => ({ o, correct: k === 0 })).sort(() => Math.random() - 0.5);
  g.current = { it, opts };
  pageEl.innerHTML = `
    <div class="game">
      <div class="g-status">round ${g.i + 1}/${g.pool.length} · score ${g.score}${g.streak > 1 ? " · streak " + g.streak : ""}</div>
      <pre class="g-anim" id="ganim" aria-hidden="true"></pre>
      <p class="g-task">Build the Russian verb — tap the prefix that fits:</p>
      <div class="g-formula">
        <span class="slot" id="gslot">?</span>
        <span class="plus">+</span>
        <span class="base">идти́</span>
        <span class="plus">=</span>
        <span class="gm">“${it.meaning}”</span>
      </div>
      <p class="g-hint">идти́ means <em>to go</em></p>
      <div class="g-opts">${opts.map((x, k) =>
        `<button class="g-opt" onclick="answer(${k})"><span class="key">${k + 1}</span>${x.o}</button>`).join("")}
      </div>
      <div class="g-fb" id="gfb"></div>
    </div>`;
  playAnim(it.frames);
}
function answer(k) {
  if (!g || g.answered || !g.current) return;
  g.answered = true;
  const { it, opts } = g.current;
  const hit = opts[k].correct;
  clearInterval(animTimer);
  const anim = document.getElementById("ganim");
  if (anim) anim.textContent = it.frames[it.frames.length - 1];
  const slot = document.getElementById("gslot");
  if (slot) { slot.textContent = it.pre; slot.classList.add(hit ? "filled" : "fixed"); }
  document.querySelectorAll(".g-opt").forEach((b, i) => {
    b.disabled = true;
    if (opts[i].correct) b.classList.add("hit");
    else if (i === k) b.classList.add("miss");
  });
  if (hit) { g.score++; g.streak++; } else { g.streak = 0; }
  document.getElementById("gfb").innerHTML =
    `${hit ? "✓" : "✗ the answer was " + it.pre + " —"} <span class="ru">${it.result}</span> · ${it.why}
     <div><button class="g-next" onclick="nextRound()">${g.i + 1 < g.pool.length ? "next →" : "results →"}</button></div>`;
}
function nextRound() {
  if (!g) return;
  g.answered = false;
  g.i++;
  if (g.i < g.pool.length) renderRound(); else endGame();
}
function endGame() {
  clearInterval(animTimer);
  const s = g.score, n = g.pool.length;
  const verdict =
    s === n       ? "flawless — you walked every path." :
    s >= n * 0.7  ? "solid — the directions are clicking." :
    s >= n * 0.4  ? "good start — the little map repeats, another walk?" :
                    "prefixes are sneaky — one more run and they start to stick.";
  pageEl.innerHTML = `
    <div class="game">
      <div class="g-status">prefix lab · finished</div>
      <div class="g-meaning">score: ${s} / ${n}</div>
      <p style="margin-top:1em">${verdict}</p>
      <p style="margin-top:1em">That was ten spatial prefixes on one verb of motion,
      <span class="ru">идти́</span>. The same little arrows drive hundreds of Russian verbs.</p>
      <div class="g-opts">
        <button class="g-opt" onclick="startGame()">play again</button>
        <button class="g-opt" onclick="showPage('main')">back to main</button>
      </div>
    </div>`;
}
/* answer with keys 1–4 */
document.addEventListener("keydown", e => {
  if (currentPage !== "game" || !g) return;
  if (document.activeElement === inputEl) return;
  if (g.answered && e.key === "Enter") { nextRound(); return; }
  if (g.answered) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) answer(n - 1);
});

/* ================= stage: phosphor oscilloscope (wide screens) ================= */
const stageMq = window.matchMedia("(min-width: 1200px)");
let stageRaf = 0;
const hexCache = {};
function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
function hexRgb(hex) {
  if (hexCache[hex]) return hexCache[hex];
  const m = hex.match(/^#?([0-9a-f]{6})$/i);
  let out = "16,20,26";
  if (m) { const n = parseInt(m[1], 16); out = `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; }
  return hexCache[hex] = out;
}
function stageFrame() {
  const cv = document.getElementById("stagecanvas");
  if (!cv || !stageMq.matches) { stageRaf = 0; return; }
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) { stageRaf = requestAnimationFrame(stageFrame); return; }
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "rgba(" + hexRgb(cssVar("--bg")) + ",1)";
    ctx.fillRect(0, 0, w, h);
  }
  const t = performance.now() / 1000;
  const dt = Math.min(0.1, t - (stageFrame.lastT || t));
  stageFrame.lastT = t;
  const fs = 17;                                   /* glyph cell size */
  const colW = 26;
  const TAIL = 9;                                  /* falling-star tail length, in rows */
  /* (re)build columns when the panel size changes */
  if (!stageFrame.cols || stageFrame.w !== w || stageFrame.h !== h) {
    stageFrame.w = w; stageFrame.h = h;
    stageFrame.cols = [];
    const n = Math.floor(w / colW);
    for (let i = 0; i < n; i++) {
      if (Math.random() < 0.25) { stageFrame.cols.push(null); continue; }
      stageFrame.cols.push({
        x: i * colW + colW / 2,
        y: Math.random() * (h / fs),
        sp: 6 + Math.random() * 7,                 /* rows per second */
        bright: Math.random() < 0.25,
        chars: []
      });
    }
  }
  /* full clear every frame — tails are drawn explicitly, nothing lingers */
  ctx.fillStyle = "rgba(" + hexRgb(cssVar("--bg")) + ",1)";
  ctx.fillRect(0, 0, w, h);

  const accent = cssVar("--accent");
  const GLYPHS = "абвгдежзиклмнопрстуфхцчшщыьэюяАБВГДЕЖЗИКЛМНПРСТУФХЦЧШЩЫЭЮЯ-́";
  ctx.font = fs + "px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = accent;

  if (reduced) {
    /* static: one scattered field of dim glyphs */
    for (const c of stageFrame.cols) {
      if (!c) continue;
      const rows = Math.floor(h / fs);
      for (let r = 0; r < rows; r += 2 + Math.floor(Math.random() * 4)) {
        ctx.globalAlpha = 0.05 + Math.random() * 0.12;
        ctx.fillText(GLYPHS[Math.floor(Math.random() * GLYPHS.length)], c.x, r * fs);
      }
    }
  } else {
    const totalRows = Math.ceil(h / fs);
    for (const c of stageFrame.cols) {
      if (!c) continue;
      const prevRow = Math.floor(c.y);
      c.y += c.sp * dt;
      const row = Math.floor(c.y);
      for (let r = prevRow; r < row; r++) {        /* one new glyph per row passed */
        c.chars.unshift(GLYPHS[Math.floor(Math.random() * GLYPHS.length)]);
      }
      if (c.chars.length > TAIL) c.chars.length = TAIL;
      /* draw head + fading tail, like a falling star */
      const headAlpha = c.bright ? 0.9 : 0.55;
      for (let i = 0; i < c.chars.length; i++) {
        const y = (row - i) * fs;
        if (y < -fs || y > h + fs) continue;
        const fade = Math.pow(1 - i / TAIL, 1.6);
        ctx.globalAlpha = headAlpha * (i === 0 ? 1 : fade * 0.8);
        ctx.shadowColor = accent;
        ctx.shadowBlur = i === 0 && c.bright ? 12 : 0;
        ctx.fillText(c.chars[i], c.x, y);
      }
      /* restart above the top once the whole tail has left the screen */
      if (row - TAIL > totalRows) {
        c.y = -Math.random() * 20;
        c.sp = 6 + Math.random() * 7;
        c.bright = Math.random() < 0.25;
        c.chars = [];
      }
    }
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  if (reduced) { stageRaf = 0; return; }        /* one static frame is enough */
  stageRaf = requestAnimationFrame(stageFrame);
}
function stageStart() {
  if (stageRaf || !stageMq.matches || document.hidden) return;
  stageRaf = requestAnimationFrame(stageFrame);
}
stageMq.addEventListener ? stageMq.addEventListener("change", stageStart) : stageMq.addListener(stageStart);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { cancelAnimationFrame(stageRaf); stageRaf = 0; }
  else stageStart();
});
window.addEventListener("resize", stageStart);

/* boot */
(async () => {
  const bl = document.getElementById("bootline");
  if (bl) bl.textContent = `booting tutor.sh … ok · build ${BUILD}`;
  stageStart();
  /* default theme by device: ruby on phones, green on desktop */
  if (window.matchMedia("(min-width: 900px)").matches) setTheme("green");
  await loadContent();
  EXT_POSTS = await loadExternalPosts();
  await wait(reduced ? 0 : 450);
  await showPage("main");
})();
</script>

</body>
